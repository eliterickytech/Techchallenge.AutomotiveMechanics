apiVersion: apps/v1
kind: Deployment
metadata:
  name: tech-challenge-api-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tech-challenge-api
  template:
    metadata:
      labels:
        app: tech-challenge-api
    spec:
      containers:
        - name: tech-challenge-api
          image: jpmarques2000/tech-challenge-api:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: tech-challenge-api-service
spec:
  type: NodePort
  selector:
    app: tech-challenge-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30001
